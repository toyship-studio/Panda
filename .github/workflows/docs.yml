name: Docs

# The documentation site (context/infrastructure.md, "Documentation"): the mdBook of
# PandaSDK/docs built on every push to main that touches it, and published to the object
# storage under site/docs/preview/ when the storage secrets are set. The release workflow
# publishes the stable copies by tag.

on:
  push:
    branches: [main]
    paths:
      - "PandaSDK/docs/**"
      - "PandaSDK/book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    name: Build and publish the documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build the book
        # PandaSDK/book.toml: src = docs, the output goes to bin/docs.
        run: mdbook build PandaSDK
      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: bin/docs
          retention-days: 7
      - name: Publish to the object storage (preview)
        if: ${{ env.S3_BUCKET != '' }}
        run: |
          aws s3 sync bin/docs "s3://${S3_BUCKET}/site/docs/preview" --endpoint-url "${S3_ENDPOINT}" --delete
